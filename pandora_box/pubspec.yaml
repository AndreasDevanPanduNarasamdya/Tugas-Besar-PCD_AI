name: pandora_box
description: 3D object scanning and reconstruction app
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5+9

  # AI / ML
  tflite_flutter: ^0.10.4

  # 3D Math
  vector_math: ^2.1.4

  # Sensors
  sensors_plus: ^4.0.2

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Export & Files
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  archive: ^3.4.9
  uuid: ^4.2.1
  image: ^4.1.7

  # UI
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  cupertino_icons: ^1.0.2
  ar_flutter_plugin_flutterflow: ^0.7.56
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/models/depth_anything_v2_small.tflite
    - assets/models/mediapipe_segmentation.tflite
    - assets/config/.env